name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm i -g corepack@latest
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm -r build
      - run: pnpm run test:unit

  # The browser tests in 14 shards, each on its own VM with one Playwright worker (docs/testing.md, CI). Playwright
  # shards a project into contiguous ranges by test count, not time, so each block of slow tests is its own project:
  # golden 2 shards (the raster goldens, about 9 minutes together), golden-pt 6 (the path-tracer tests, about 20
  # minutes; its two longest tests, 3.0 and 1.9 minutes, are four tests apart and fit one 7-minute shard only with
  # 6), pair 3 (the preview-vs-render pairing tests, about 11 minutes) and bake 3 (the baked lighting tests, 13-15
  # minutes on a slow VM). One runner ran past the 20-minute limit with the whole suite.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: golden-1, project: golden, shard: '1/2' }
          - { name: golden-2, project: golden, shard: '2/2' }
          - { name: golden-pt-1, project: golden-pt, shard: '1/6' }
          - { name: golden-pt-2, project: golden-pt, shard: '2/6' }
          - { name: golden-pt-3, project: golden-pt, shard: '3/6' }
          - { name: golden-pt-4, project: golden-pt, shard: '4/6' }
          - { name: golden-pt-5, project: golden-pt, shard: '5/6' }
          - { name: golden-pt-6, project: golden-pt, shard: '6/6' }
          - { name: pair-1, project: pair, shard: '1/3' }
          - { name: pair-2, project: pair, shard: '2/3' }
          - { name: pair-3, project: pair, shard: '3/3' }
          - { name: bake-1, project: bake, shard: '1/3' }
          - { name: bake-2, project: bake, shard: '2/3' }
          - { name: bake-3, project: bake, shard: '3/3' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm i -g corepack@latest
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @modelshot/harness exec playwright install --with-deps --only-shell chromium
      - run: pnpm -r build
      - run: pnpm --filter @modelshot/harness exec playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - run: pnpm --filter @modelshot/site run test:browser
        if: ${{ matrix.name == 'golden-1' && !cancelled() }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: browser-test-results-${{ matrix.name }}
          path: |
            tools/harness/test-results/
            packages/site/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # The budget bench alone on a VM, so its numbers do not share a machine with a golden shard.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm i -g corepack@latest
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @modelshot/harness exec playwright install --with-deps --only-shell chromium
      - run: pnpm -r build
      - run: pnpm --filter @modelshot/harness exec playwright test --project=bench
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: browser-test-results-bench
          path: tools/harness/test-results/
          retention-days: 14
          if-no-files-found: ignore
